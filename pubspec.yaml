name: seemidia
description: "SeeMidia - Display Digital para Estabelecimentos Comerciais"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  http: ^1.5.0
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  device_info_plus: ^10.1.2
  crypto: ^3.0.5
  flutter_vlc_player: ^7.4.3
  cached_network_image: ^3.4.1
  wakelock_plus: ^1.2.8
  ultralytics_yolo: ^0.1.26
  flutter_uvc_camera: ^1.0.0
  image: ^4.5.4
  path_provider: ^2.1.1
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/models/yolo11n.tflite
