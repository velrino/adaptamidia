name: seemidia
description: "SeeMidia - Display Digital para Estabelecimentos Comerciais"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  http: ^1.5.0
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4
  device_info_plus: ^10.1.2
  crypto: ^3.0.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.3.2
  wakelock_plus: ^1.2.8
  ultralytics_yolo: ^0.1.26
  flutter_uvc_camera: ^1.0.0
  image: ^4.5.4
  path_provider: ^2.1.1
  path: ^1.9.1
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.1
  webview_flutter_wkwebview: ^3.23.0
  flutter_vlc_player: ^7.4.3
  video_player: ^2.9.1
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/models/yolo11n.tflite
