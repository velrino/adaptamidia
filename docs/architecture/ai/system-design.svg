<svg aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1050" role="img"><title id="t">AdaptaMídia · Agentic system design</title><desc id="d">Proposed architecture for evidence-based campaign workflows, with cross-cutting trust controls and a gated pilot rollout.</desc><rect x="1" y="1" width="1098" height="1048" rx="10" fill="#ffffff" stroke="#ffffff" /><text x="32" y="37" font-size="18" font-family="Arial, sans-serif" font-weight="bold" fill="#2454a6">AdaptaMídia   /   Architecture proposal</text><text x="32" y="93" font-size="42" font-family="Arial, sans-serif" font-weight="bold" fill="#211833">Agentic system design</text><text x="32" y="135" font-size="20" font-family="Arial, sans-serif" font-weight="normal" fill="#55536b">How a playback event becomes a reviewable campaign insight</text><rect x="32" y="167" width="749" height="86" rx="10" fill="#f6f7fb" stroke="#d8dce8" /><text x="48" y="199" font-size="22" font-family="Arial, sans-serif" font-weight="bold" fill="#2454a6">1   Entry points</text><text x="48" y="233" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Admin requests a report. The scheduler opens recurring campaign runs.</text><path d="M407 254L407 275 M410.0 267.0 L407 275 L404.0 267.0" stroke="#2454a6" fill="none" /><rect x="32" y="278" width="749" height="95" rx="10" fill="#f6f7fb" stroke="#d8dce8" /><text x="48" y="310" font-size="22" font-family="Arial, sans-serif" font-weight="bold" fill="#2454a6">2   AI intake</text><text x="48" y="344" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Authorize account and unit, check quota and workflow state, then reserve the run.</text><path d="M407 374L407 396 M410.0 388.0 L407 396 L404.0 388.0" stroke="#2454a6" fill="none" /><rect x="32" y="399" width="749" height="193" rx="10" fill="#f6f7fb" stroke="#d8dce8" /><text x="48" y="431" font-size="22" font-family="Arial, sans-serif" font-weight="bold" fill="#067c87">3   Workflow orchestrator</text><text x="48" y="465" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Check evidence coverage and delegate a bounded task.</text><path d="M406 477L156 502 M164.2588086787429 504.18908181846194 L156 502 L163.66178636461692 498.21885867720204" stroke="#2454a6" fill="none" /><rect x="48" y="504" width="224" height="67" rx="10" fill="#ffffff" stroke="#b8cfda" /><text x="57" y="528" font-size="18" font-family="Arial, sans-serif" font-weight="bold" fill="#067c87">Insight writer</text><text x="57" y="553" font-size="15" font-family="Arial, sans-serif" font-weight="normal" fill="#55536b">Single playback</text><path d="M406 477L397 502 M402.5324179817881 495.4890591098684 L397 502 L396.88709351057577 493.45674230023195" stroke="#2454a6" fill="none" /><rect x="289" y="504" width="224" height="67" rx="10" fill="#ffffff" stroke="#b8cfda" /><text x="298" y="528" font-size="18" font-family="Arial, sans-serif" font-weight="bold" fill="#067c87">Campaign analyst</text><text x="298" y="553" font-size="15" font-family="Arial, sans-serif" font-weight="normal" fill="#55536b">Period comparison</text><path d="M406 477L638 502 M630.3674621709237 498.16016064298014 L638 502 L629.7246319214227 504.12562535835025" stroke="#2454a6" fill="none" /><rect x="530" y="504" width="224" height="67" rx="10" fill="#ffffff" stroke="#b8cfda" /><text x="539" y="528" font-size="18" font-family="Arial, sans-serif" font-weight="bold" fill="#067c87">Triage assistant</text><text x="539" y="553" font-size="15" font-family="Arial, sans-serif" font-weight="normal" fill="#55536b">Optional incident summary</text><rect x="32" y="613" width="243" height="147" rx="10" fill="#f6f7fb" stroke="#d8dce8" /><text x="48" y="645" font-size="22" font-family="Arial, sans-serif" font-weight="bold" fill="#633da2">4   Models</text><text x="48" y="679" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Direct Google baseline</text><text x="48" y="703" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Provider adapter</text><text x="48" y="727" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Text + response schema</text><rect x="285" y="613" width="243" height="147" rx="10" fill="#f6f7fb" stroke="#d8dce8" /><text x="301" y="645" font-size="22" font-family="Arial, sans-serif" font-weight="bold" fill="#067c87">5   Tools</text><text x="301" y="679" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Scoped metric queries</text><text x="301" y="703" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Schema validation</text><text x="301" y="727" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Human review</text><rect x="538" y="613" width="243" height="147" rx="10" fill="#f6f7fb" stroke="#d8dce8" /><text x="554" y="645" font-size="22" font-family="Arial, sans-serif" font-weight="bold" fill="#3f6d36">6   Knowledge</text><text x="554" y="679" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">MongoDB snapshots</text><text x="554" y="703" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Coverage and cutoff</text><text x="554" y="727" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Approved findings</text><rect x="32" y="780" width="749" height="105" rx="10" fill="#f6f7fb" stroke="#d8dce8" /><text x="48" y="812" font-size="22" font-family="Arial, sans-serif" font-weight="bold" fill="#2454a6">7   Async execution</text><text x="48" y="846" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Kiosk → Firebase RTDB → API ingestion. Bull / Redis delivers AI run IDs.</text><text x="48" y="870" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">A worker claims each run and saves the outcome in MongoDB.</text><rect x="801" y="167" width="267" height="718" rx="10" fill="#f5f1fa" stroke="#d5c9e7" /><text x="818" y="203" font-size="23" font-family="Arial, sans-serif" font-weight="bold" fill="#633da2">8   Trust controls</text><text x="820" y="259" font-size="20" font-family="Arial, sans-serif" font-weight="bold" fill="#633da2">Scope</text><text x="820" y="286" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Account and unit checks</text><text x="820" y="308" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">on every run and query.</text><text x="820" y="362" font-size="20" font-family="Arial, sans-serif" font-weight="bold" fill="#633da2">Evidence</text><text x="820" y="389" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Mark missing or late data.</text><text x="820" y="411" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Cite a versioned snapshot.</text><text x="820" y="465" font-size="20" font-family="Arial, sans-serif" font-weight="bold" fill="#633da2">Workflow pause</text><text x="820" y="492" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Check before dispatch</text><text x="820" y="514" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">and model invocation.</text><text x="820" y="568" font-size="20" font-family="Arial, sans-serif" font-weight="bold" fill="#633da2">Provider fallback</text><text x="820" y="595" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Approved routes share a</text><text x="820" y="617" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">retry and token budget.</text><text x="820" y="671" font-size="20" font-family="Arial, sans-serif" font-weight="bold" fill="#633da2">Audit trail</text><text x="820" y="698" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Record versions, usage,</text><text x="820" y="720" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">latency and review.</text><text x="820" y="774" font-size="20" font-family="Arial, sans-serif" font-weight="bold" fill="#633da2">Human decision</text><text x="820" y="801" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">An operator approves</text><text x="820" y="823" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">experiment proposals.</text><rect x="32" y="910" width="1036" height="108" rx="10" fill="#f6f7fb" stroke="#d8dce8" /><text x="49" y="943" font-size="22" font-family="Arial, sans-serif" font-weight="bold" fill="#2454a6">9   Evaluation and rollout</text><text x="49" y="989" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Replay fixtures</text><path d="M223 982L270 982 M262.0 979.0 L270 982 L262.0 985.0" stroke="#2454a6" fill="none" /><text x="301" y="989" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Compare to baseline</text><path d="M475 982L522 982 M514.0 979.0 L522 982 L514.0 985.0" stroke="#2454a6" fill="none" /><text x="553" y="989" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Pilot one workflow</text><path d="M727 982L774 982 M766.0 979.0 L774 982 L766.0 985.0" stroke="#2454a6" fill="none" /><text x="805" y="989" font-size="17" font-family="Arial, sans-serif" font-weight="normal" fill="#211833">Expand or roll back</text></svg>