name: Deploy to Google Cloud with GPU

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: rare-tape-466414-f4
  INSTANCE_NAME: api-vision
  ZONE: us-central1-f
  IMAGE_NAME: api-vision

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker gcr.io

      - name: Build Docker image
        run: |
          docker build -t gcr.io/$PROJECT_ID/$IMAGE_NAME:latest .

      - name: Push Docker image to GCR
        run: |
          docker push gcr.io/$PROJECT_ID/$IMAGE_NAME:latest

      - name: Delete existing instance (if exists)
        run: |
          gcloud compute instances delete $INSTANCE_NAME --zone=$ZONE --quiet || true

      - name: Create new Compute Engine instance
        run: |
          # Try GPU first, fallback to CPU if unavailable
          for zone in us-central1-f us-central1-c us-central1-a; do
            echo "Trying GPU in zone: $zone"
            if gcloud compute instances create $INSTANCE_NAME \
              --zone=$zone \
              --machine-type=n1-standard-8 \
              --accelerator=type=nvidia-tesla-t4,count=1 \
              --boot-disk-size=200GB \
              --image-family=cos-stable \
              --image-project=cos-cloud \
              --metadata=install-gpu-driver=True \
              --maintenance-policy=TERMINATE \
              --preemptible \
              --tags=http-server,https-server \
              --scopes=https://www.googleapis.com/auth/cloud-platform \
              --service-account=github-actions@$PROJECT_ID.iam.gserviceaccount.com 2>/dev/null; then
              echo "GPU_ENABLED=true" >> $GITHUB_ENV
              echo "ACTUAL_ZONE=$zone" >> $GITHUB_ENV
              exit 0
            fi
          done

          # Fallback to CPU if GPU fails
          echo "GPU unavailable, using CPU-only"
          gcloud compute instances create $INSTANCE_NAME \
            --zone=$ZONE \
            --machine-type=e2-highcpu-16 \
            --boot-disk-size=200GB \
            --image-family=cos-stable \
            --image-project=cos-cloud \
            --preemptible \
            --tags=http-server,https-server \
            --scopes=https://www.googleapis.com/auth/cloud-platform \
            --service-account=github-actions@$PROJECT_ID.iam.gserviceaccount.com
          echo "GPU_ENABLED=false" >> $GITHUB_ENV
          echo "ACTUAL_ZONE=$ZONE" >> $GITHUB_ENV

      - name: Create firewall rules (if not exist)
        run: |
          # Check and create allow-fastapi rule
          if ! gcloud compute firewall-rules describe allow-fastapi --quiet 2>/dev/null; then
            gcloud compute firewall-rules create allow-fastapi \
              --allow tcp:8000 \
              --source-ranges 0.0.0.0/0 \
              --target-tags http-server
          fi

          # Check and create allow-http rule
          if ! gcloud compute firewall-rules describe allow-http --quiet 2>/dev/null; then
            gcloud compute firewall-rules create allow-http \
              --allow tcp:80 \
              --source-ranges 0.0.0.0/0 \
              --target-tags http-server
          fi

          # Check and create allow-https rule
          if ! gcloud compute firewall-rules describe allow-https --quiet 2>/dev/null; then
            gcloud compute firewall-rules create allow-https \
              --allow tcp:443 \
              --source-ranges 0.0.0.0/0 \
              --target-tags https-server
          fi

      - name: Wait for instance to be ready
        run: |
          echo "Aguardando instância e drivers de GPU ficarem prontos..."
          sleep 180

      - name: Deploy application to instance
        run: |
          gcloud compute ssh $INSTANCE_NAME --zone=${ACTUAL_ZONE:-$ZONE} --command="
            # Configure Docker to use gcloud auth (now available with service account)
            docker-credential-gcr configure-docker
            
            # Stop any existing containers
            docker stop \$(docker ps -q) 2>/dev/null || true
            docker rm \$(docker ps -aq) 2>/dev/null || true
            
            # Pull and run the latest image
            docker pull gcr.io/$PROJECT_ID/$IMAGE_NAME:latest
            if [ \"$GPU_ENABLED\" = \"true\" ]; then
              # Install nvidia-container-runtime if not present
              if ! docker info | grep -q nvidia; then
                curl -s -L https://nvidia.github.io/nvidia-container-runtime/gpgkey | sudo apt-key add -
                distribution=\$(. /etc/os-release;echo \$ID\$VERSION_ID)
                curl -s -L https://nvidia.github.io/nvidia-container-runtime/\$distribution/nvidia-container-runtime.list | sudo tee /etc/apt/sources.list.d/nvidia-container-runtime.list
                sudo apt-get update && sudo apt-get install -y nvidia-container-runtime
                sudo systemctl restart docker
              fi
              docker run --runtime=nvidia -d -p 8000:8000 --restart=always --name api-app gcr.io/$PROJECT_ID/$IMAGE_NAME:latest
            else
              docker run -d -p 8000:8000 --restart=always --name api-app gcr.io/$PROJECT_ID/$IMAGE_NAME:latest
            fi
          "

      - name: Update instance in Load Balancer
        run: |
          ZONE_TO_USE=${ACTUAL_ZONE:-$ZONE}

          # Remove old backends and instance groups from all possible zones
          for cleanup_zone in us-central1-a us-central1-c us-central1-f; do
            gcloud compute backend-services remove-backend api-backend-service --instance-group=api-instance-group --instance-group-zone=$cleanup_zone --global 2>/dev/null || true
            gcloud compute instance-groups unmanaged delete api-instance-group --zone=$cleanup_zone --quiet 2>/dev/null || true
          done

          # Create new instance group in correct zone
          gcloud compute instance-groups unmanaged create api-instance-group --zone=$ZONE_TO_USE
          gcloud compute instance-groups unmanaged set-named-ports api-instance-group --named-ports=http:8000 --zone=$ZONE_TO_USE

          # Add instance to group
          gcloud compute instance-groups unmanaged add-instances api-instance-group --instances=$INSTANCE_NAME --zone=$ZONE_TO_USE

          # Add to backend service
          gcloud compute backend-services add-backend api-backend-service --instance-group=api-instance-group --instance-group-zone=$ZONE_TO_USE --global

          # Update backend service to use correct port name
          gcloud compute backend-services update api-backend-service --global --port-name=http

      - name: Get Load Balancer IP
        id: get-lb-ip
        run: |
          LB_IP=$(gcloud compute forwarding-rules describe api-http-forwarding-rule --global --format="value(IPAddress)")
          echo "LB_IP=$LB_IP" >> $GITHUB_OUTPUT
          echo "🌐 Load Balancer HTTP: http://$LB_IP"

      - name: Test Load Balancer endpoint
        run: |
          echo "Aguardando Load Balancer ficar ativo..."
          sleep 60
          curl -f http://${{ steps.get-lb-ip.outputs.LB_IP }}/docs || echo "Load Balancer ainda não está ativo, pode levar alguns minutos"
